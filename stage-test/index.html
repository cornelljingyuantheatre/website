<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>境缘 · 舞台性能测试</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c0807; color: #f5e6da; color-scheme: dark; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; font: 14px system-ui, sans-serif; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; border-bottom: 1px solid #52362a; }
  h1 { margin: 0; font-size: 15px; }
  .modes { display: flex; flex-wrap: wrap; gap: 5px; }
  button { color: inherit; background: #2b1a15; border: 1px solid #654638; border-radius: 5px; padding: 6px 9px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #743324; border-color: #b86946; }
  button:focus-visible { outline: 2px solid #ffb581; outline-offset: 2px; }
  #status { margin: 0; color: #dbc0ad; }
  iframe { display: block; border: 0; width: 100%; height: 100%; background: black; }
</style>
<header class="controls">
  <h1>舞台性能测试</h1>
  <div class="modes" role="group" aria-label="选择测试版本">
    <button data-mode="live" aria-pressed="false">现版</button>
    <button data-mode="touch" aria-pressed="false">仅修触屏</button>
    <button data-mode="letters" aria-pressed="false">触屏＋字标试验</button>
  </div>
  <button id="replay">重播</button>
  <p id="status" role="status"></p>
</header>
<iframe id="stage" title="境缘舞台测试" allowfullscreen></iframe>
<script src="preview.js" defer></script>
</html>
